name: Automatic pre-release

on:
  push:
    branches:
      - main
    # Only source/build changes deserve a new binary pre-release; docs-only
    # commits should not produce an empty build.
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/automatic-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The analysis tree is not needed to compile the mod and is large;
          # cone mode still checks out the root Gradle files.
          sparse-checkout: |
            src
            gradle
          sparse-checkout-cone-mode: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Stage artifacts
        run: |
          mkdir -p dist
          for jar in build/libs/*.jar; do
            case "$jar" in
              *-sources.jar|*-dev.jar) ;;
              *) cp "$jar" dist/ ;;
            esac
          done
          ls -la dist

      - name: Create automatic pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="auto-build"
          # Keep exactly one automatic pre-release: remove every prior
          # auto-build release (and its tag) before publishing the new jar.
          previous=$(gh release list --limit 100 --json tagName \
            --jq '.[].tagName' | grep '^auto-build' || true)
          for old in $previous; do
            gh release delete "$old" --yes --cleanup-tag || true
          done
          notes=$(cat <<EOF
          > **Automatic build — not a stable release.**

          This pre-release was generated automatically by the "Automatic pre-release" GitHub Actions workflow from commit [${GITHUB_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) after a push to \`main\`.

          It is an untested development snapshot and has not been manually reviewed. Download it at your own risk; use a stable release for normal play.
          EOF
          )
          gh release create "$tag" dist/*.jar \
            --target "$GITHUB_SHA" \
            --title "Automatic build" \
            --notes "$notes" \
            --prerelease
